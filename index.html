<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build-a-Bot Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one arcade-cabinet column. HUD strip, pixel screen, parts tray. Lessons open as a modal terminal card. */
:root {
  color-scheme: dark;
  --ink: #0b0f24;        /* cabinet black-blue */
  --panel: #161c3d;      /* bezel */
  --line: #2b3a7a;       /* rules, wall blue */
  --text: #fff1e8;       /* warm paper white */
  --dim: #a7a3c2;        /* secondary text */
  --amber: #ffa300;      /* primary accent */
  --good: #00e436;
  --bad: #ff004d;
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text); font-family: var(--body); font-size: 22px; line-height: 1.25;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
.cab { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.marquee { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; }
.marquee h1 { font-family: var(--display); font-size: clamp(14px, 2.6vw, 22px); margin: 0; color: var(--amber); letter-spacing: 1px; text-shadow: 3px 3px 0 #7e2553; }
.marquee small { font-family: var(--display); font-size: 9px; color: var(--dim); letter-spacing: 2px; }
.hud { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--display); font-size: 10px; background: var(--panel); border: 2px solid var(--line); padding: 10px 12px; align-items: center; }
.hud b { color: var(--amber); font-weight: normal; }
.hud .grow { flex: 1; }
.bar { display: inline-block; width: 70px; height: 10px; border: 2px solid var(--dim); vertical-align: middle; position: relative; }
.bar i { position: absolute; inset: 0; width: 100%; background: #ffec27; display: block; }
.screen { position: relative; background: #000; border: 4px solid var(--line); box-shadow: 0 0 0 4px var(--panel), 0 0 40px rgba(41,173,255,.15); }
.screen canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 320 / 176; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
.lessonbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; }
@media (max-width: 720px) { .lessonbar { grid-template-columns: minmax(0, 1fr); } }
.idea, .ticker { border: 2px solid var(--line); background: var(--panel); padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.idea { border-color: var(--lc, var(--amber)); }
.idea em { font-style: normal; color: var(--lc, var(--amber)); }
.lbl { font-family: var(--display); font-size: 8px; letter-spacing: 2px; color: var(--lc, var(--amber)); }
.ticker b { font-family: var(--display); font-size: 11px; font-weight: normal; color: var(--lc, var(--amber)); }
.ticker.pop { animation: pop .5s steps(4); }
@keyframes pop { 0% { background: var(--lc, var(--amber)); } 100% { background: var(--panel); } }
@media (prefers-reduced-motion: reduce) { .ticker.pop { animation: none; } }
.analogy { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--ink); border: 2px solid var(--c, var(--amber)); padding: 12px; }
.analogy .eq { font-family: var(--display); font-size: clamp(13px, 2.6vw, 18px); line-height: 1.6; }
.analogy .eq em { font-style: normal; color: var(--c, var(--amber)); }
.collected { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px; }
.collected div { border: 1px solid var(--line); padding: 6px 8px; min-width: 0; }
.collected div b { display: block; font-family: var(--display); font-size: 9px; font-weight: normal; color: var(--c, var(--amber)); margin-bottom: 2px; }
.pickup { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(88%, 480px); z-index: 4; cursor: pointer;
  background: var(--panel); border: 4px solid var(--pc, var(--amber)); box-shadow: 6px 6px 0 #000; padding: clamp(8px, 2vw, 16px);
  display: flex; flex-direction: column; gap: clamp(2px, .8vw, 6px); text-align: center; }
.pickup .k, .pickup .r { font-family: var(--display); font-size: clamp(6px, 1.3vw, 9px); letter-spacing: 2px; color: var(--pc, var(--amber)); }
.pickup .n { font-family: var(--display); font-size: clamp(11px, 2.8vw, 20px); line-height: 1.4; }
.pickup .f { font-size: clamp(15px, 2.6vw, 24px); line-height: 1.15; }
.pickup .r { color: var(--dim); letter-spacing: 1px; }
.pickup .r em { font-style: normal; color: var(--pc, var(--amber)); }
.pickup .tb { height: 4px; background: var(--pc, var(--amber)); transform-origin: left; animation: drain 2.6s linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.pickup .picon { width: clamp(36px, 9vw, 84px); height: auto; aspect-ratio: 1; image-rendering: pixelated; align-self: center; }
.icon { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
.ticker { flex-direction: row; align-items: center; gap: 10px; }
.ticker .tt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ticker .icon { width: 44px; height: 44px; }
.findrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.findrow div { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-family: var(--display); font-size: 7px; line-height: 1.5; color: var(--dim); border: 1px solid var(--line); padding: 6px 4px; min-width: 0; overflow-wrap: anywhere; }
.findrow .icon { width: 48px; height: 48px; }
.collected div { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: start; }
.slot .icon { width: 28px; height: 28px; display: block; margin: 0 auto 4px; }
.slot:not(.on) .icon { opacity: .4; filter: grayscale(1); }
.strip { display: flex; flex-wrap: wrap; gap: 4px; }
.strip .icon { width: 26px; height: 26px; }
.mright { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.trophybtn { font-family: var(--display); font-size: 9px; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
  background: var(--panel); color: #ffec27; border: 2px solid #ffec27; box-shadow: 3px 3px 0 #000; cursor: pointer; animation: shine 1.4s steps(2) infinite; }
.trophybtn .icon { width: 24px; height: 24px; }
.trophybtn:hover { background: var(--line); }
.trophybtn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
@keyframes shine { 50% { border-color: var(--amber); } }
.party-title { color: #ffec27; text-shadow: 3px 3px 0 #7e2553; font-size: clamp(16px, 4vw, 26px) !important; animation: rainbow 1.2s steps(3) infinite; }
@keyframes rainbow { 0% { color: #ffec27; } 33% { color: #ff77a8; } 66% { color: #29adff; } }
.partycv { display: block; width: 100%; height: auto; aspect-ratio: 200 / 120; image-rendering: pixelated; border: 2px solid var(--line); background: #0b0f24; }
.wlist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.wlist .place { font-family: var(--display); font-size: 9px; color: var(--ink); background: #ffec27; padding: 3px 6px; }
@media (prefers-reduced-motion: reduce) { .trophybtn, .party-title { animation: none; } }
.diagram { display: block; width: 100%; max-width: 560px; height: auto; aspect-ratio: 320 / 176; image-rendering: pixelated; border: 2px solid var(--line); background: #0b0f24; }
.slot .role { display: block; color: var(--dim); }
.slot.on .role { color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--display); font-size: 9px; letter-spacing: 1px; color: var(--c, var(--amber)); }
.field input { font-family: var(--body); font-size: 24px; padding: 6px 10px; background: var(--ink); color: var(--text); border: 2px solid var(--line); max-width: 360px; width: 100%; }
.field input:focus-visible { outline: 3px solid var(--c, var(--amber)); outline-offset: 2px; }
.report { background: var(--text); color: var(--ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.report .hdr { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; font-family: var(--display); font-size: 10px; line-height: 1.6; }
.report .hdr strong { font-size: 13px; font-weight: normal; }
.report .wrap { overflow-x: auto; }
.report table { color: inherit; font-family: var(--body); border-collapse: collapse; width: 100%; font-size: 19px; line-height: 1.15; }
.report th { font-family: var(--display); font-size: 8px; text-align: left; padding: 4px 6px; border-bottom: 2px solid var(--ink); }
.report td { padding: 5px 6px; border-bottom: 1px solid #c9c3d6; vertical-align: top; }
.report td.ok { color: #007a2e; font-family: var(--display); font-size: 9px; white-space: nowrap; }
.report td.miss { color: #c4003b; font-family: var(--display); font-size: 9px; white-space: nowrap; }
.report .picked { color: #c4003b; }
.report textarea { width: 100%; height: 140px; font-family: var(--body); font-size: 16px; }
.tryit { font-family: var(--display); font-size: 10px; line-height: 1.8; color: var(--ink); background: var(--c, var(--amber)); padding: 8px 10px; }
.tray { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.slot { border: 2px dashed var(--line); padding: 6px 4px; text-align: center; font-family: var(--display); font-size: 8px; color: var(--dim); line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.slot.on { border-style: solid; color: var(--ink); }
.help { font-size: 18px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.help kbd { font-family: var(--display); font-size: 9px; color: var(--text); border: 1px solid var(--dim); padding: 2px 4px; }
.touch { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; touch-action: none; }
@media (pointer: coarse) { .touch { display: flex; } .help { display: none; } }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
.dpad button, .boost { font-family: var(--display); font-size: 14px; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 0; touch-action: none; }
.dpad button:active, .boost:active { background: var(--line); }
.boost { width: 96px; height: 96px; border-radius: 50%; color: var(--amber); border-color: var(--amber); }

/* modal terminal card */
.modal { position: fixed; inset: 0; background: rgba(5,7,18,.88); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 100%; max-width: 680px; margin: auto 0; background: var(--panel); border: 4px solid var(--c, var(--amber)); box-shadow: 8px 8px 0 #000; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--display); font-size: 9px; letter-spacing: 2px; color: var(--c, var(--amber)); }
.card h2 { font-family: var(--display); font-size: clamp(15px, 3vw, 20px); line-height: 1.5; margin: 0; text-wrap: balance; }
.card h3 { font-family: var(--display); font-size: 10px; letter-spacing: 1px; color: var(--c, var(--amber)); margin: 6px 0 0; }
.card p { margin: 0; max-width: 62ch; }
.card ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.card li { padding-left: 18px; position: relative; }
.card li::before { content: "▸"; position: absolute; left: 0; color: var(--c, var(--amber)); }
.card li b { color: var(--text); font-weight: normal; text-decoration: underline; text-decoration-color: var(--c, var(--amber)); text-underline-offset: 3px; }
.note { border-left: 4px solid var(--c, var(--amber)); padding: 6px 12px; background: rgba(0,0,0,.25); color: var(--text); }
.dimtext { color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font-family: var(--display); font-size: 11px; padding: 12px 14px; background: var(--c, var(--amber)); color: var(--ink); border: 0; cursor: pointer; box-shadow: 4px 4px 0 #000; }
.btn.alt { background: transparent; color: var(--text); border: 2px solid var(--dim); box-shadow: none; }
.btn:focus-visible, .ans:focus-visible, .dpad button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.answers { display: flex; flex-direction: column; gap: 8px; }
.ans { text-align: left; font-family: var(--body); font-size: 22px; padding: 8px 12px; background: var(--ink); color: var(--text); border: 2px solid var(--line); cursor: pointer; display: flex; gap: 12px; align-items: baseline; }
.ans span { font-family: var(--display); font-size: 10px; color: var(--c, var(--amber)); }
.ans:hover:not(:disabled) { border-color: var(--c, var(--amber)); }
.ans.right { border-color: var(--good); background: #0c2a17; }
.ans.wrong { border-color: var(--bad); background: #2a0c16; }
.ans:disabled { cursor: default; }
.fb { padding: 8px 12px; border: 2px solid; }
.fb.good { border-color: var(--good); } .fb.bad { border-color: var(--bad); }
.fb strong { font-family: var(--display); font-size: 10px; display: block; margin-bottom: 4px; }
.fb.good strong { color: var(--good); } .fb.bad strong { color: var(--bad); }
.bots { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bots canvas, .analogy canvas { image-rendering: pixelated; width: 128px; height: 128px; background: var(--ink); border: 2px solid var(--line); max-width: 100%; }
.arrow { font-family: var(--display); font-size: 16px; color: var(--c, var(--amber)); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.mcard { border: 2px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mcard .t { font-family: var(--display); font-size: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { border: 2px solid var(--line); padding: 8px; }
.stat div:first-child { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 1px; }
.stat div:last-child { font-family: var(--display); font-size: 16px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.title-art { display: flex; justify-content: center; }
.title-art canvas { width: 192px; height: 192px; image-rendering: pixelated; }
.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
@media (max-width: 520px) { .tray { grid-template-columns: repeat(3, minmax(0, 1fr)); } .hud { font-size: 9px; } }
</style>

<div class="cab">
  <div class="marquee">
    <h1>BUILD-A-BOT LAB</h1>
    <div class="mright">
      <small>MDEANH ROBOTICS · INTRO TO ROBOT PARTS</small>
      <button class="trophybtn" id="winnersBtn" type="button">HACKATHON WINNERS</button>
    </div>
  </div>
  <div class="hud" id="hud">
    <span id="hLevel">LEVEL 1</span>
    <span>HP <b id="hHp">♥♥</b></span>
    <span>PARTS <b id="hChips">0/5</b></span>
    <span id="hEnergyWrap" hidden>ENERGY <span class="bar"><i id="hEnergy"></i></span></span>
    <span class="grow"></span>
    <span>SCORE <b id="hScore">0</b></span>
  </div>
  <div class="screen"><canvas id="game" width="320" height="176" aria-label="Game screen: drive BOLT the robot around the lab"></canvas><div class="pickup" id="pickup" hidden aria-live="polite"></div></div>
  <div class="lessonbar" id="lessonbar">
    <div class="idea"><span class="lbl">BIG IDEA</span><span id="bigIdea">Every robot is built from six systems.</span></div>
    <div class="ticker" id="ticker"><img class="icon" id="tickIcon" alt="" hidden><div class="tt"><span class="lbl" id="tickLbl">MISSION</span><span id="tickText">Press START to begin.</span></div></div>
  </div>
  <div class="tray" id="tray"></div>
  <div class="help">
    <span><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> drive</span>
    <span><kbd>SPACE</kbd> boost (after Power)</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> sound</span>
    <span><kbd>1-4</kbd> answer quizzes</span>
  </div>
  <div class="touch" id="touch">
    <div class="dpad">
      <span></span><button data-k="up" aria-label="Up">▲</button><span></span>
      <button data-k="left" aria-label="Left">◀</button><span></span><button data-k="right" aria-label="Right">▶</button>
      <span></span><button data-k="down" aria-label="Down">▼</button><span></span>
    </div>
    <button class="boost" data-k="boost">BOOST</button>
  </div>
</div>
<div class="modal" id="modal" hidden></div>

<script>
// ---------- content ----------
const LEVELS = [
  { id: 'chassis', name: 'Chassis', role: 'the skeleton', color: '#c2c6d6', chips: 5, bugs: 2, bugSpeed: 20, walls: 20,
    big: "The CHASSIS is the robot's SKELETON. It holds every part in place and protects it.",
    items: [["Aluminum frame", "Light and strong. The most common frame metal for robots."], ["Steel bracket", "Very strong but heavy. Used in big factory robot arms."], ["3D-printed shell", "Cheap and fast to redesign. Great for prototypes."], ["Carbon-fiber plate", "Super light and stiff. Used on drones."], ["Bumper", "Absorbs hits so the electronics inside survive."]],
    brief: ['LOOSE PARTS', "BOLT is just a bare circuit board on tiny wheels. One bump from a glitch and it falls apart. Collect 5 frame pieces, then roll back to the striped workbench to install them."],
    ability: ['ARMOR', '+2 hit points. A frame protects the electronics inside.'],
    what: "The chassis is a robot's skeleton. It holds every other part in place and protects the fragile electronics from bumps, dust, and water.",
    real: "A Roomba keeps everything inside a round plastic shell so it can slide off furniture legs. NASA's Mars rovers use lightweight metal bodies that keep their electronics warm and protected.",
    terms: [['Payload', 'the weight a robot can carry beyond its own body'], ['Center of gravity', "the balance point. Keep heavy parts low so the robot doesn't tip over."]],
    fact: 'Every extra gram in the frame needs more motor force and more battery to move it. Designers are always trading strength against weight.',
    quiz: [
      { q: "What does a robot's chassis do?", a: ['Holds the parts together and protects them', "Runs the robot's program", "Stores the robot's energy", 'Measures distance to walls'], why: 'The chassis is the structure. Programs run on the controller, energy lives in the battery, and distance comes from sensors.' },
      { q: "Why don't engineers build every robot out of thick steel?", a: ['Heavy frames need bigger motors and batteries', "Steel blocks the robot's software", "Steel can't be bolted together", 'Robots are not allowed to be strong'], why: 'Weight costs energy. A heavier frame needs stronger motors and a bigger battery, and those add even more weight.' } ] },
  { id: 'motors', name: 'Actuators', role: 'the muscles', color: '#ffa300', chips: 6, bugs: 3, bugSpeed: 24, walls: 24,
    big: "ACTUATORS are the robot's MUSCLES. They turn energy into motion.",
    items: [["DC motor", "Spins fast and nonstop. Drives wheels and propellers."], ["Servo motor", "Turns to an exact angle and holds it. Used in joints."], ["Stepper motor", "Moves in tiny, exact steps. Used in 3D printers."], ["Gearbox", "Trades speed for torque: slower, but stronger."], ["Hydraulic cylinder", "Uses fluid pressure to push very hard. Found in excavators."], ["Pneumatic piston", "Uses compressed air for fast push-pull motion."]],
    brief: ['STUCK IN LOW GEAR', "BOLT has a frame now, but it can barely crawl. Its little wheels have no real motors. Find 6 motor parts so it can move with purpose."],
    ability: ['DRIVE', 'Much faster movement. Motors turn electrical energy into motion.'],
    what: "Actuators are a robot's muscles. They turn energy into movement: spinning a wheel, bending a joint, or squeezing a gripper. Electric motors are the most common kind.",
    real: "Hobby robot arms use a small servo in every joint. A sidewalk delivery robot's wheels are each driven by an electric motor.",
    terms: [['Torque', 'twisting force: how hard a motor can turn something'], ['Gearbox', 'a set of gears that trades speed for torque (slower, but stronger)']],
    fact: 'A bare motor usually spins too fast and too weakly to move a robot. Nearly every robot wheel or joint has a gearbox between it and the motor.',
    quiz: [
      { q: 'A robot arm joint must move to exactly 90° and hold there. Which actuator fits best?', a: ['Servo motor', 'Cooling fan', 'Battery', 'Ultrasonic sensor'], why: 'A servo moves to a commanded angle and holds it. That is exactly what a joint needs.' },
      { q: 'What does adding a gearbox to a motor usually do?', a: ['Slows it down but makes it stronger (more torque)', 'Makes it faster and stronger at the same time', 'Lets it run without power', 'Turns it into a sensor'], why: "Gears trade speed for torque. You can't get both for free." } ] },
  { id: 'power', name: 'Power', role: 'the energy supply', color: '#ffec27', chips: 6, bugs: 3, bugSpeed: 28, walls: 26,
    big: "POWER is the robot's ENERGY SUPPLY. It stores energy and delivers it to every part.",
    items: [["LiPo battery", "Packs lots of energy for its weight. Powers drones and phones."], ["Lead-acid battery", "Heavy and cheap. Used in big, slow carts."], ["Voltage regulator", "Converts battery voltage to what each part needs, like 5 V."], ["Emergency stop", "Cuts the power instantly. Every real robot needs one."], ["Fuse", "Breaks the circuit if too much current flows, to prevent fires."], ["Charging dock", "Where robot vacuums drive back to recharge."]],
    brief: ['RUNNING ON FUMES', "Real motors are hungry. BOLT's tiny backup cell can't deliver bursts of energy. Collect 6 battery cells to build a proper power pack."],
    ability: ['BOOST', 'Hold SPACE for a burst of speed. The energy bar recharges when you let go.'],
    what: 'The power system stores energy and delivers it to every part. Most mobile robots run on rechargeable batteries. Many factory robots plug straight into wall power.',
    real: 'A robot vacuum drives itself back to its dock when its battery runs low. Campus delivery robots recharge between runs.',
    terms: [['Voltage (V)', "the electrical 'push'"], ['Current (A)', 'how much electricity is flowing'], ['Capacity (mAh or Wh)', 'how much energy is stored, which sets how long the robot runs']],
    fact: 'Motors can pull many times more current than the computer, especially when starting up or stalled. LiPo batteries can catch fire if punctured or overcharged, so handle them with care.',
    quiz: [

  if (S.compass) {
    let tgt = ready ? G.bench : null, best = 1e9;

    if (tgt && Math.hypot(tgt.x - p.x, tgt.y - p.y) > 20) {
      const ang = Math.atan2(tgt.y - p.y, tgt.x - p.x), r = 14;
      const ax = p.x + Math.cos(ang) * r, ay = p.y + Math.sin(ang) * r;
      ctx.fillStyle = '#00e436';
      for (let i = 0; i < 3; i++) ctx.fillRect(Math.round(ax - Math.cos(ang) * i * 2) - 1, Math.round(ay - Math.sin(ang) * i * 2) - 1, 3 - i, 3 - i);

  if (ready) { ctx.fillStyle = '#ffa300'; const yy = by - 6 + Math.round(Math.sin(t * 6) * 2); ctx.fillRect(G.bench.x - 2, yy, 5, 2); ctx.fillRect(G.bench.x - 1, yy + 2, 3, 1); ctx.fillRect(G.bench.x, yy + 3, 1, 1); }
  for (const f of G.fx) { ctx.fillStyle = f.c; ctx.fillRect(Math.round(f.x), Math.round(f.y), 2, 2); }
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'center';
  for (const f of G.float) {
    const w = ctx.measureText(f.s).width / 2, x = Math.min(W - w - 2, Math.max(w + 2, f.x)), y = Math.max(10, f.y - (1.2 - f.t) * 10);
    ctx.fillStyle = '#000'; ctx.fillText(f.s, x + 1, y + 1); ctx.fillStyle = '#ffec27'; ctx.fillText(f.s, x, y);
  }
  if (G.combo > 1 && G.comboT > 0) { ctx.textAlign = 'right'; ctx.fillStyle = '#000'; ctx.fillText(`COMBO x${G.combo}`, W - 5, 13); ctx.fillStyle = '#ff77a8'; ctx.fillText(`COMBO x${G.combo}`, W - 6, 12); }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 1.5; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.countdown > 0) {
    const n = Math.ceil(G.countdown), label = n > 3 ? 'READY' : String(n);
    ctx.fillStyle = 'rgba(3,4,12,.55)'; ctx.fillRect(0, H / 2 - 22, W, 44);
    ctx.textAlign = 'center'; ctx.font = '16px "Press Start 2P", monospace';
    ctx.fillStyle = '#000'; ctx.fillText(label, W / 2 + 2, H / 2 + 8); ctx.fillStyle = L.color; ctx.fillText(label, W / 2, H / 2 + 6);
  }
}
function drawAttract() {

const DIAG = { gripper: [2, 0, 'L', 0], sensors: [8, 0, 'R', 0], chassis: [3, 7, 'L', 1], controller: [9, 8, 'R', 1], power: [6, 14, 'L', 2], motors: [14, 10, 'R', 2] };
function drawDiagram(g, parts, focus, t) {
  const s = 7, ox = 104, oy = 32;
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#0b0f24'; g.fillRect(0, 0, 320, 176);
  drawRobot(g, ox, oy, s, parts, t);
  g.font = '8px "Press Start 2P", monospace'; g.textBaseline = 'top';
  for (const l of PARTS) {
    const [ax, ay, side, row] = DIAG[l.id], on = parts.includes(l.id), isF = l.id === focus;
    const col = on || isF ? l.color : '#4a4f6e';
    const y = 18 + row * 58, tx = side === 'L' ? 6 : 314, lx = side === 'L' ? 104 : 216;
    const px = ox + ax * s + 3, py = oy + ay * s + 3;
    // elbow leader line: across at label height, then up/down to the part
    g.fillStyle = col;
    const dash = on ? 1 : 2;
    for (let x = Math.min(lx, px); x <= Math.max(lx, px); x++) if (dash === 1 || x % 4 < 2) g.fillRect(x, y + 4, 1, 1);
    for (let yy = Math.min(y + 4, py); yy <= Math.max(y + 4, py); yy++) if (dash === 1 || yy % 4 < 2) g.fillRect(px, yy, 1, 1);
    g.fillRect(px - 1, py - 1, 3, 3);
    g.textAlign = side === 'L' ? 'left' : 'right';
    const name = on || isF ? l.name.toUpperCase() : '???';
    if (isF) {
      const w = g.measureText(name).width;
      g.fillStyle = Math.floor(t * 2) % 2 ? l.color : '#fff1e8';
      g.fillRect(side === 'L' ? tx - 2 : tx - w - 2, y - 2, w + 4, 12);
      g.fillStyle = '#0b0f24';
    } else g.fillStyle = col;
    g.fillText(name, tx, y);
    g.fillStyle = on || isF ? '#fff1e8' : '#4a4f6e';
    g.fillText('= ' + SHORT[l.id], tx, y + 13);
    if (isF && !on) { g.fillStyle = l.color; g.fillText('THIS LEVEL', tx, y + 26); }
    if (isF && on) { g.fillStyle = l.color; g.fillText('NEW!', tx, y + 26); }
  }
}

    <p class="dimtext">Parts you've recovered in any playthrough stay here for review.</p>
    <div class="grid">${PARTS.map(l => u.includes(l.id)
      ? `<div class="mcard" style="border-color:${l.color}"><div class="t" style="color:${l.color}">${esc(l.name.toUpperCase())}</div><div class="dimtext">${esc(l.role)}</div><div class="strip">${l.items.map(([n]) => iconImg(n).replace('alt=""', `alt="${esc(n)}" title="${esc(n)}"`)).join('')}</div><div>${esc(l.what)}</div><div class="dimtext">${l.terms.map(t => esc(t[0])).join(' · ')}</div></div>`
      : `<div class="mcard"><div class="t">??????</div><div class="dimtext">Recover this part in the lab to unlock its entry.</div></div>`).join('')}</div>
    <div class="row"><button class="btn" data-act="back" data-primary>BACK</button></div>`, '#ffa300', { back });
}

// ---------- hackathon winners ----------
const HACKATHON = { name: 'Retro Game Hackathon', date: 'October 28, 2026' };
// Add each winning team here and it shows on the celebration screen, e.g.
// { place: '1st place', team: 'Team Pixel', game: 'Moon Miner' }
const WINNERS = [];
const CONFETTI = ['#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#ff77a8', '#fff1e8'];
const reducedMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
let partyFx = [], partyNext = 0;
function fanfare() {
  if (!soundOn) return;
  try {
    let at = audio().currentTime + .02;
    for (const [f, d] of [[523, .12], [659, .12], [784, .12], [1046, .26], [784, .12], [1046, .55]]) { tone(f, at, d, 'square', .07); tone(f / 2, at, d, 'triangle', .06); at += d; }
  } catch (e) {}
}
function partyBurst(n) {
  for (let i = 0; i < n; i++) {
    const x = 20 + Math.random() * 160, y = 10 + Math.random() * 36, c = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
    for (let k = 0; k < 22; k++) { const a = k / 22 * 6.283, v = 22 + Math.random() * 26; partyFx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: .7 + Math.random() * .5, c, delay: i * .22 }); }
  }
}
// opens over whatever is on screen (title, a lesson, mid-level) and BACK puts it all back
function celebrate() {
  if (G.state === 'party') return;
  modal.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
  const saved = { open: !modal.hidden, html: modal.innerHTML, actions, state: G.state };
  for (const k in keys) keys[k] = false;
  G.state = 'party'; partyFx = []; partyNext = .4;
  const back = () => {
    G.state = saved.state; partyFx = [];
    if (!saved.open) { hide(); return; }
    modal.innerHTML = saved.html; actions = saved.actions; modal.hidden = false;
    paintBots();
    const p = modal.querySelector('[data-primary]'); if (p) p.focus({ preventScroll: true });
  };
  show(`<div class="eyebrow">${esc(HACKATHON.name.toUpperCase())} · ${esc(HACKATHON.date.toUpperCase())}</div>
    <h2 class="party-title">CONGRATULATIONS, WINNERS!</h2>
    <canvas class="partycv" id="partycv" width="200" height="120" aria-label="BOLT the robot lifting a trophy while fireworks go off"></canvas>
    ${WINNERS.length ? `<ul class="wlist">${WINNERS.map(w => `<li><span class="place">${esc(w.place)}</span><b>${esc(w.team)}</b>${w.game ? `<span class="dimtext">${esc(w.game)}</span>` : ''}</li>`).join('')}</ul>` : ''}
    <p>To today's winning teams: you took an idea to a playable retro game in a single day. That takes skill, teamwork, and a lot of grit.</p>
    <p class="dimtext">BOLT and everyone at mdeanh Robotics are cheering for you.</p>
    <div class="row"><button class="btn" data-act="cheer" data-primary>CHEER AGAIN</button><button class="btn alt" data-act="back">${saved.state === 'play' ? 'BACK TO THE GAME' : 'BACK'}</button></div>`,
    '#ffec27', { cheer: () => { fanfare(); partyBurst(5); }, back });
  fanfare(); partyBurst(4);
  drawParty(0);
}
function drawParty(dt) {
  const cv = $('partycv'); if (!cv) return;
  const g = cv.getContext('2d'), still = reducedMotion(), all = PARTS.map(l => l.id), t = still ? 0 : G.t;
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#0b0f24'; g.fillRect(0, 0, 200, 120);
  for (let i = 0; i < 24; i++) { g.fillStyle = (i + Math.floor(t * 3)) % 5 ? '#2b3a7a' : '#fff1e8'; g.fillRect((i * 53) % 197, (i * 29) % 56, 1, 1); }
  if (!still) {
    if ((partyNext -= dt) <= 0) { partyBurst(1); partyNext = .6 + Math.random() * .6; }
    partyFx = partyFx.filter(p => { if (p.delay > 0) { p.delay -= dt; return true; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; p.vx *= .985; return (p.t -= dt) > 0; });
    for (const p of partyFx) if (!(p.delay > 0)) { g.fillStyle = p.c; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
  }
  g.fillStyle = '#141a38'; g.fillRect(0, 108, 200, 12);
  g.fillStyle = '#232c5c'; for (let x = 0; x < 200; x += 16) g.fillRect(x, 108, 1, 1);
  const hop = (ph, h) => Math.round(Math.abs(Math.sin(t * 4 + ph)) * h);
  drawRobot(g, 34, 108 - 32 - hop(1.6, 6), 2, all, G.t);
  drawRobot(g, 134, 108 - 32 - hop(.8, 6), 2, all, G.t);
  const by = 108 - 48 - hop(0, 10);
  drawRobot(g, 76, by, 3, all, G.t);
  g.drawImage(icon('Trophy').cv, 0, 0, 12, 12, 82, by - 34, 36, 36);
}
$('winnersBtn').insertAdjacentHTML('afterbegin', iconImg('Trophy'));
$('winnersBtn').addEventListener('click', () => { sfx('click'); celebrate(); });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); hud();
  if (G.state === 'party') drawParty(dt);
  if (!modal.hidden && Math.floor(G.t * 8) !== Math.floor((G.t - dt) * 8)) paintBots();
  requestAnimationFrame(frame);
}
title();
requestAnimationFrame(frame);
</script>
